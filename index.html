<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Faire-part de mariage</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    /* Conteneur plein écran pour la vidéo */
    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* La vidéo s’adapte à l’orientation sans être coupée */
    video {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain; /* important : ne jamais couper l’image */
      background: #000;
    }

    /* Overlay pour le fondu avant la redirection PDF */
    #fadeOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 50;
    }

    #fadeOverlay.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="screen">
    <video id="weddingVideo" controls playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4" />
      Votre navigateur ne supporte pas la lecture de cette vidéo.
    </video>
  </div>

  <div id="fadeOverlay"></div>

  <script>
    const weddingVideo = document.getElementById('weddingVideo');
    const fadeOverlay = document.getElementById('fadeOverlay');

    function goToPdf() {
      // Lance un fondu au noir
      fadeOverlay.classList.add('visible');

      // Après le fondu, redirection vers le PDF
      setTimeout(() => {
        window.location.href = 'faire-part.pdf';
      }, 600); // même durée que la transition CSS
    }

    // Quand la vidéo se termine naturellement
    weddingVideo.addEventListener('ended', goToPdf);
  </script>
</body>
</html>
