<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faire-part de mariage</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #skipVideoBtn {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    #skipVideoBtn:active {
      transform: scale(0.97);
    }

    /* Overlay pour le fondu */
    #fadeOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease; /* durée du fondu */
      z-index: 50;
    }

    #fadeOverlay.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Écran vidéo -->
  <div id="videoSection" class="screen">
    <video id="weddingVideo" controls playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4" />
      Votre navigateur ne supporte pas la lecture de cette vidéo.
    </video>
    <button id="skipVideoBtn">Passer la vidéo</button>
  </div>

  <!-- Overlay pour la transition -->
  <div id="fadeOverlay"></div>

  <script>
    const weddingVideo = document.getElementById('weddingVideo');
    const skipVideoBtn = document.getElementById('skipVideoBtn');
    const fadeOverlay = document.getElementById('fadeOverlay');

    function goToPdf() {
      // lance un fondu au noir
      fadeOverlay.classList.add('visible');

      // on attend la fin du fondu, puis on redirige
      setTimeout(() => {
        window.location.href = 'faire-part.pdf';
      }, 600); // même durée que la transition CSS
    }

    function handleSkip() {
      try {
        weddingVideo.pause();
      } catch (e) {}
      goToPdf();
    }

    // Quand la vidéo se termine naturellement
    weddingVideo.addEventListener('ended', goToPdf);

    // Quand on clique sur "Passer la vidéo"
    skipVideoBtn.addEventListener('click', handleSkip);
  </script>
</body>
</html>
